services:
  # n8n Workflow Automation
  n8n:
    profiles: ["extras"]
    image: n8nio/n8n:latest
    container_name: library-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Ho_Chi_Minh}
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=regular
      - LIBRARY_API_URL=${LIBRARY_API_URL}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - DSPACE_API_URL=${DSPACE_API_URL:-https://lib.hpu.edu.vn/server}
      - DSPACE_API_TOKEN=${DSPACE_API_TOKEN}
      - DSPACE_BASE_URL=${DSPACE_BASE_URL:-https://lib.hpu.edu.vn}
      - DSPACE_DEFAULT_COLLECTION=${DSPACE_DEFAULT_COLLECTION}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-library-admin@hpu.edu.vn}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
      - ./scripts:/opt/library-digitization/scripts
      - ${DIGITIZE_DATA_DIR}:/data/digitization
    networks:
      - library-net
    depends_on:
      - postgres
      - redis

  # PostgreSQL Database
  postgres:
    # profiles: ["extras"]
    image: postgres:15-alpine
    container_name: library-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-library_digitization}
      - POSTGRES_USER=${POSTGRES_USER:-libraryuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - library-net
    ports:
      - "5432:5432"

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - library-net
    ports:
      - "6379:6379"

  # Processing Worker (Python with GPU support)
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-library_digitization}
      - POSTGRES_USER=${POSTGRES_USER:-libraryuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DIGITIZE_DATA_DIR=/data/digitization/jobs
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Model provider (YC-MP-04) — dùng khi worker trích xuất qua factory (GĐ1).
      # Mặc định 'cloud' giữ nguyên hành vi hiện tại. Danh sách công cụ: scripts/providers/registry.py
      - MODEL_PROVIDER=${MODEL_PROVIDER:-cloud}
      # Công cụ đảm nhiệm mỗi chế độ khi định tuyến theo độ nhạy cảm (YC-DR).
      # Tài liệu Nội bộ/Nhạy cảm LUÔN đi vào LOCAL_PROVIDER (ràng buộc cứng YC-DR-03).
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-claude}
      - LOCAL_PROVIDER=${LOCAL_PROVIDER:-ollama}
      # -- Công cụ TẠI CHỖ: điểm cuối là tên service trong mạng nội bộ library-net --
      - OLLAMA_URL=http://ollama:11434
      - LOCAL_MODEL=${LOCAL_MODEL:-qwen2.5:7b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL:-http://llamacpp:8080/v1}
      - LLAMACPP_MODEL=${LLAMACPP_MODEL:-local-model}
      # -- Công cụ ĐÁM MÂY: chỉ có hiệu lực khi được chọn; khóa nào trống thì công cụ đó không dùng được --
      - CLOUD_MODEL=${CLOUD_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - MOONSHOT_MODEL=${MOONSHOT_MODEL:-}
      - MOONSHOT_BASE_URL=${MOONSHOT_BASE_URL:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_MODEL=${DASHSCOPE_MODEL:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - AZURE_OPENAI_BASE_URL=${AZURE_OPENAI_BASE_URL:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL:-}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_MODEL=${OPENAI_COMPAT_MODEL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_DEPLOYMENT=${OPENAI_COMPAT_DEPLOYMENT:-cloud}
    volumes:
      - ./scripts:/app/scripts
      - ./configs:/app/configs
      - ${DIGITIZE_DATA_DIR}:/data/digitization
    networks:
      - library-net
    depends_on:
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "10"        # 10 logical cores/worker
          memory: "12G"     # 12GB/worker (an toàn)
        reservations:
          cpus: "8"         # Đảm bảo tối thiểu
          memory: "8G"

  # ===================================================================
  # MODEL SERVING TẠI CHỖ (YC-MS) — BA lựa chọn, mỗi lựa chọn một profile RIÊNG.
  # `docker compose up` mặc định KHÔNG chạy cái nào (bổ sung, không viết lại).
  # Chỉ bật MỘT công cụ tại một thời điểm để không tranh RAM/GPU:
  #     Ollama    (dựng nhanh nhất, CPU tốt):  docker compose --profile local-ai up -d
  #     vLLM      (thông lượng cao, cần GPU):  docker compose --profile local-ai-vllm up -d
  #     llama.cpp (nhẹ nhất, CPU):             docker compose --profile local-ai-llamacpp up -d
  # Rồi đặt LOCAL_PROVIDER=ollama | vllm | llamacpp trong .env. KHÔNG service nào map cổng ra host
  # (YC-MS-01, YC-BM-05) — chỉ truy cập được trong mạng nội bộ library-net.
  # ===================================================================

  # Lựa chọn 1 — Ollama (ADR-002: công cụ của GĐ0)
  #   Tải model 1 lần:  docker compose exec ollama ollama pull qwen2.5:7b
  #   Kiểm chứng ngắt mạng (KT-BM-01): sau khi có model trong volume, ngắt Internet vẫn xử lý được.
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    container_name: library-ollama
    restart: unless-stopped
    # KHÔNG map cổng ra host (YC-MS-01, YC-BM-05): chỉ truy cập trong mạng nội bộ library-net.
    expose:
      - "11434"
    volumes:
      # YC-MS-02: model lưu trên volume, không tải lại mỗi lần khởi động
      - ollama_data:/root/.ollama
    networks:
      - library-net
    healthcheck:
      # YC-MS-04: kiểm tra sẵn sàng trước khi đưa tài liệu vào xử lý
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # GPU tùy chọn: nếu server có NVIDIA GPU, bỏ comment khối dưới (SRS: không GPU thì chạy CPU).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Lựa chọn 2 — vLLM: thông lượng cao khi có GPU. Ứng viên thay Ollama ở GĐ1 nếu nghẽn (ADR-002).
  # Nói giao thức tương thích OpenAI → dùng OpenAICompatProvider, KHÔNG cần viết thêm lớp nào.
  #   Bật:  docker compose --profile local-ai-vllm up -d   +   LOCAL_PROVIDER=vllm
  # ⚠️ vLLM TẢI MODEL TỪ HUGGING FACE lúc khởi động → lần đầu PHẢI có mạng; sau đó model nằm trong
  #    volume nên chạy được khi ngắt Internet (YC-MS-02/03). Rà giấy phép model TRƯỚC (YC-PL-01).
  vllm:
    profiles: ["local-ai-vllm"]
    image: vllm/vllm-openai:latest
    container_name: library-vllm
    restart: unless-stopped
    expose:
      - "8000"
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.90}
    environment:
      - HF_HOME=/models
      # Chỉ cần khi tải model có kiểm soát truy cập (gated) — vd họ Llama
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm_models:/models      # YC-MS-02: model bền vững qua khởi động lại
    networks:
      - library-net
    healthcheck:
      # YC-MS-04: /health là điểm cuối kiểm tra sẵn sàng của vLLM
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s         # nạp model lần đầu có thể mất vài phút
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Lựa chọn 3 — llama.cpp: nhẹ nhất, chạy CPU, không cần GPU. Dùng model GGUF đặt sẵn trong volume
  # → phù hợp nhất cho kịch bản air-gapped tuyệt đối (không tải gì lúc khởi động).
  #   Đặt file .gguf vào volume llamacpp_models rồi:
  #   docker compose --profile local-ai-llamacpp up -d   +   LOCAL_PROVIDER=llamacpp
  llamacpp:
    profiles: ["local-ai-llamacpp"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: library-llamacpp
    restart: unless-stopped
    expose:
      - "8080"
    command: >
      -m /models/${LLAMACPP_GGUF_FILE:-model.gguf}
      --host 0.0.0.0 --port 8080
      -c ${LLAMACPP_CTX_SIZE:-8192}
      -t ${LLAMACPP_THREADS:-8}
    volumes:
      - llamacpp_models:/models   # YC-MS-02: đặt file .gguf đã rà giấy phép vào đây
    networks:
      - library-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # FastAPI Service - Enhanced API with UI support
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: library-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DIGITIZE_DATA_DIR=/data/digitization/jobs
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-library_digitization}
      - POSTGRES_USER=${POSTGRES_USER:-libraryuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - DSPACE_API_URL=${DSPACE_API_URL}
      - DSPACE_API_TOKEN=${DSPACE_API_TOKEN}
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./configs:/app/configs
      - ${DIGITIZE_DATA_DIR}:/data/digitization
    networks:
      - library-net
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # UI Service - Digitization Dashboard
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: library-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # DSpace config
      - NEXT_PUBLIC_DSPACE_URL=${DSPACE_BASE_URL}
      
      # OCR API config
      - NEXT_PUBLIC_OCR_API_URL=http://api:8000
      
      # Claude API (for metadata extraction)
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      
      # Node environment
      - NODE_ENV=production
    networks:
      - library-net
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Dashboard (Optional - Grafana)
  grafana:
    profiles: ["extras"]
    image: grafana/grafana:latest
    container_name: library-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Changed to 3001 to avoid conflict with UI
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - library-net
    depends_on:
      - postgres

  # File Browser (Optional - for managing processed files)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: library-filebrowser
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ${DIGITIZE_DATA_DIR}:/srv
      - filebrowser_data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
    networks:
      - library-net

volumes:
  ollama_data:          # YC-MS-02: lưu model tại chỗ, bền vững qua khởi động lại
    driver: local
  vllm_models:          # YC-MS-02: cache model của vLLM (HF_HOME)
    driver: local
  llamacpp_models:      # YC-MS-02: chứa file .gguf cho llama.cpp
    driver: local
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  filebrowser_data:
    driver: local

networks:
  library-net:
    driver: bridge