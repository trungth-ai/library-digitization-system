<rect x="0" y="1230" width="1240" height="524" fill="#FFFFFF"/><text x="80" y="130" font-family="'Calibri','Arial',sans-serif" font-size="20" font-weight="bold" fill="#8FB6C9" text-anchor="start">TRƯỜNG ĐẠI HỌC QUẢN LÝ VÀ CÔNG NGHỆ HẢI PHÒNG</text><text x="80" y="162" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#6E93A6" text-anchor="start">Trung tâm Hỗ trợ Khởi nghiệp và Đổi mới sáng tạo (SCEI)</text><text x="80" y="380" font-family="'Cambria','Times New Roman',serif" font-size="118" font-weight="bold" fill="#FFFFFF" text-anchor="start">DocuFlow</text><text x="80" y="490" font-family="'Cambria','Times New Roman',serif" font-size="118" font-weight="bold" fill="#D98E04" text-anchor="start">HP</text><rect x="80" y="540" width="440" height="6" fill="#1C7293"/><text x="80" y="610" font-family="'Calibri','Arial',sans-serif" font-size="40" font-weight="normal" fill="#CADCFC" text-anchor="start">Số hóa và trích xuất dữ liệu</text>
<text x="80" y="666" font-family="'Calibri','Arial',sans-serif" font-size="40" font-weight="normal" fill="#CADCFC" text-anchor="start">tự động từ hồ sơ giấy</text>
<text x="80" y="722" font-family="'Calibri','Arial',sans-serif" font-size="40" font-weight="normal" fill="#CADCFC" text-anchor="start">bằng trí tuệ nhân tạo</text><rect x="80" y="790" width="560" height="56" rx="28" fill="#1C7293"/><text x="360" y="828" font-family="'Calibri','Arial',sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ĐÃ TRIỂN KHAI – ĐANG VẬN HÀNH THỰC TẾ</text><circle cx="102" cy="912" r="16" fill="#D98E04"/><text x="102" y="919" font-family="'Cambria','Times New Roman',serif" font-size="17" font-weight="bold" fill="#21295C" text-anchor="middle">1</text><text x="140" y="920" font-family="'Cambria','Times New Roman',serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="start">Không chỉ đọc chữ</text><text x="140" y="950" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#8FA8C4" text-anchor="start">Bóc tách từng trường thông tin theo lược đồ</text><circle cx="102" cy="990" r="16" fill="#D98E04"/><text x="102" y="997" font-family="'Cambria','Times New Roman',serif" font-size="17" font-weight="bold" fill="#21295C" text-anchor="middle">2</text><text x="140" y="998" font-family="'Cambria','Times New Roman',serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="start">Con người quyết định</text><text x="140" y="1028" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#8FA8C4" text-anchor="start">Cán bộ duyệt trước khi ghi — luôn luôn</text><circle cx="102" cy="1068" r="16" fill="#D98E04"/><text x="102" y="1075" font-family="'Cambria','Times New Roman',serif" font-size="17" font-weight="bold" fill="#21295C" text-anchor="middle">3</text><text x="140" y="1076" font-family="'Cambria','Times New Roman',serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="start">Chuẩn lưu trữ quốc tế</text><text x="140" y="1106" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#8FA8C4" text-anchor="start">PDF/A-2b (ISO 19005-2) · Dublin Core (ISO 15836)</text><circle cx="102" cy="1146" r="16" fill="#D98E04"/><text x="102" y="1153" font-family="'Cambria','Times New Roman',serif" font-size="17" font-weight="bold" fill="#21295C" text-anchor="middle">4</text><text x="140" y="1154" font-family="'Cambria','Times New Roman',serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="start">Nền tảng nguồn mở</text><text x="140" y="1184" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#8FA8C4" text-anchor="start">Không phí bản quyền, chạy máy chủ thông thường</text><text x="80" y="1310" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#21295C" text-anchor="start">Bài toán</text><text x="80" y="1356" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">Quản trị đô thị thông minh vận hành trên dữ liệu số. Nhưng công văn, quyết</text>
<text x="80" y="1384.5" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">định, hồ sơ thủ tục vẫn nằm trong giấy hoặc file scan không đọc được — nằm</text>
<text x="80" y="1413" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">ngoài mọi hệ thống phân tích của thành phố.</text><rect x="80" y="1490" width="335" height="120" rx="8" fill="#E8F1F5"/><text x="104" y="1542" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#D98E04" text-anchor="start">[cần điền]</text><text x="104" y="1578" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="normal" fill="#5A6B75" text-anchor="start">Tài liệu đã xử lý</text><rect x="445" y="1490" width="335" height="120" rx="8" fill="#E8F1F5"/><text x="469" y="1542" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#D98E04" text-anchor="start">[cần điền]</text><text x="469" y="1578" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="normal" fill="#5A6B75" text-anchor="start">Độ chính xác trích xuất</text><rect x="810" y="1490" width="335" height="120" rx="8" fill="#E8F1F5"/><text x="834" y="1542" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#D98E04" text-anchor="start">[cần điền]</text><text x="834" y="1578" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="normal" fill="#5A6B75" text-anchor="start">Giờ công tiết kiệm</text><text x="80" y="1670" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="bold" fill="#21295C" text-anchor="start">Cuộc thi Tìm kiếm tài năng khởi nghiệp sáng tạo thành phố Hải Phòng 2026</text><text x="80" y="1700" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="normal" fill="#5A6B75" text-anchor="start">Chủ đề "Smart City Operations" · Lĩnh vực 3: Quản trị đô thị thông minh</text></svg>