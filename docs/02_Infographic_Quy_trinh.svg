<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1240" viewBox="0 0 1754 1240">
<rect width="1754" height="1240" fill="#FFFFFF"/>
<rect x="0" y="0" width="1754" height="200" fill="#21295C"/>
<circle cx="1660" cy="40" r="180" fill="#065A82" opacity="0.4"/><text x="80" y="90" font-family="'Cambria','Times New Roman',serif" font-size="46" font-weight="bold" fill="#FFFFFF" text-anchor="start">DocuFlow HP</text><text x="80" y="140" font-family="'Calibri','Arial',sans-serif" font-size="24" font-weight="normal" fill="#8FB6C9" text-anchor="start">Quy trình sáu bước: từ tài liệu giấy đến dữ liệu sẵn sàng dùng</text><rect x="80" y="280" width="510" height="270" rx="12" fill="#F5F9FB"/><circle cx="135" cy="338" r="32" fill="#065A82"/><text x="135" y="350" font-family="'Cambria','Times New Roman',serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="185" y="332" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#21295C" text-anchor="start">Tiếp nhận</text><text x="112" y="410" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">Tải tài liệu scan lên hệ thống. Kéo thả, tải hàng</text>
<text x="112" y="438.5" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">loạt, theo dõi tiến trình thời gian thực.</text><path d="M 595 415 L 620 415" stroke="#1C7293" stroke-width="4"/><path d="M 618 408 L 626 415 L 618 422 Z" fill="#1C7293"/><rect x="625" y="280" width="510" height="270" rx="12" fill="#F5F9FB"/><circle cx="680" cy="338" r="32" fill="#065A82"/><text x="680" y="350" font-family="'Cambria','Times New Roman',serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="730" y="332" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#21295C" text-anchor="start">Tối ưu</text><text x="657" y="410" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">Nén hai pha bằng Ghostscript: giảm dung lượng trước</text>
<text x="657" y="438.5" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">và sau khi nhận dạng.</text><path d="M 1140 415 L 1165 415" stroke="#1C7293" stroke-width="4"/><path d="M 1163 408 L 1171 415 L 1163 422 Z" fill="#1C7293"/><rect x="1170" y="280" width="510" height="270" rx="12" fill="#F5F9FB"/><circle cx="1225" cy="338" r="32" fill="#1C7293"/><text x="1225" y="350" font-family="'Cambria','Times New Roman',serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="1275" y="332" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#21295C" text-anchor="start">Nhận dạng</text><text x="1202" y="410" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">OCR tiếng Việt và tiếng Anh, tạo lớp văn bản tìm</text>
<text x="1202" y="438.5" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">kiếm được. Xuất chuẩn PDF/A-2b.</text><rect x="80" y="610" width="510" height="270" rx="12" fill="#F5F9FB"/><circle cx="135" cy="668" r="32" fill="#1C7293"/><text x="135" y="680" font-family="'Cambria','Times New Roman',serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="185" y="662" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#21295C" text-anchor="start">Trích xuất AI</text><text x="112" y="740" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">Mô hình phân tích ngữ nghĩa, bóc tách từng trường</text>
<text x="112" y="768.5" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">thông tin theo lược đồ đã cấu hình.</text><path d="M 595 745 L 620 745" stroke="#1C7293" stroke-width="4"/><path d="M 618 738 L 626 745 L 618 752 Z" fill="#1C7293"/><rect x="625" y="610" width="510" height="270" rx="12" fill="#FDF6E8"/><circle cx="680" cy="668" r="32" fill="#D98E04"/><text x="680" y="680" font-family="'Cambria','Times New Roman',serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="730" y="662" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#21295C" text-anchor="start">Cán bộ duyệt</text><text x="657" y="740" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">Xem, sửa, xác nhận. Hệ thống không bao giờ ghi dữ</text>
<text x="657" y="768.5" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">liệu mà không có người xác nhận.</text><text x="657" y="850" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="bold" fill="#8A5D04" text-anchor="start" font-style="italic">Điểm thiết kế quan trọng nhất</text><path d="M 1140 745 L 1165 745" stroke="#1C7293" stroke-width="4"/><path d="M 1163 738 L 1171 745 L 1163 752 Z" fill="#1C7293"/><rect x="1170" y="610" width="510" height="270" rx="12" fill="#F5F9FB"/><circle cx="1225" cy="668" r="32" fill="#065A82"/><text x="1225" y="680" font-family="'Cambria','Times New Roman',serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="1275" y="662" font-family="'Cambria','Times New Roman',serif" font-size="30" font-weight="bold" fill="#21295C" text-anchor="start">Đẩy vào hệ thống</text><text x="1202" y="740" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">Tự động gửi tài liệu và dữ liệu vào hệ thống đích</text>
<text x="1202" y="768.5" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">qua REST API.</text><rect x="80" y="960" width="1594" height="120" rx="10" fill="#E8F1F5"/><text x="110" y="1010" font-family="'Cambria','Times New Roman',serif" font-size="26" font-weight="bold" fill="#21295C" text-anchor="start">Đầu ra chuẩn hóa, sẵn sàng tích hợp</text><text x="110" y="1048" font-family="'Calibri','Arial',sans-serif" font-size="19" font-weight="normal" fill="#5A6B75" text-anchor="start">PDF/A-2b (ISO 19005-2) — lưu trữ số dài hạn  ·  Dublin Core (ISO 15836) — metadata chuẩn quốc tế  ·  JSON có cấu trúc — nạp vào hệ thống đích qua API</text><text x="80" y="1160" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="normal" fill="#8A98A2" text-anchor="start">Trường Đại học Quản lý và Công nghệ Hải Phòng · Trung tâm Hỗ trợ Khởi nghiệp và Đổi mới sáng tạo (SCEI)</text></svg>