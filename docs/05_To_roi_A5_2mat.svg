<svg xmlns="http://www.w3.org/2000/svg" width="1748" height="1240" viewBox="0 0 1748 1240">
<rect width="1748" height="1240" fill="#FFFFFF"/>
<line x1="874" y1="0" x2="874" y2="1240" stroke="#D8E2E8" stroke-width="2" stroke-dasharray="10 8"/><rect x="0" y="0" width="874" height="1240" fill="#21295C"/><circle cx="820" cy="120" r="260" fill="#065A82" opacity="0.4"/><text x="60" y="90" font-family="'Calibri','Arial',sans-serif" font-size="15" font-weight="bold" fill="#8FB6C9" text-anchor="start">TRƯỜNG ĐẠI HỌC QUẢN LÝ VÀ CÔNG NGHỆ HẢI PHÒNG</text><text x="60" y="116" font-family="'Calibri','Arial',sans-serif" font-size="13" font-weight="normal" fill="#6E93A6" text-anchor="start">Trung tâm Hỗ trợ Khởi nghiệp và Đổi mới sáng tạo (SCEI)</text><text x="60" y="300" font-family="'Cambria','Times New Roman',serif" font-size="78" font-weight="bold" fill="#FFFFFF" text-anchor="start">DocuFlow</text><text x="60" y="378" font-family="'Cambria','Times New Roman',serif" font-size="78" font-weight="bold" fill="#D98E04" text-anchor="start">HP</text><rect x="60" y="410" width="280" height="5" fill="#1C7293"/><text x="60" y="470" font-family="'Calibri','Arial',sans-serif" font-size="30" font-weight="normal" fill="#CADCFC" text-anchor="start">Số hóa và trích xuất dữ liệu</text>
<text x="60" y="512" font-family="'Calibri','Arial',sans-serif" font-size="30" font-weight="normal" fill="#CADCFC" text-anchor="start">tự động từ hồ sơ giấy</text><text x="60" y="555" font-family="'Calibri','Arial',sans-serif" font-size="22" font-weight="normal" fill="#8FA8C4" text-anchor="start" font-style="italic">bằng trí tuệ nhân tạo</text><rect x="60" y="620" width="440" height="48" rx="24" fill="#1C7293"/><text x="280" y="652" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ĐANG VẬN HÀNH THỰC TẾ TỪ 2025</text><text x="60" y="750" font-family="'Cambria','Times New Roman',serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="start">Bài toán</text><text x="60" y="790" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#9AAECC" text-anchor="start">Quản trị đô thị thông minh vận hành trên dữ liệu số.</text>
<text x="60" y="817" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#9AAECC" text-anchor="start">Nhưng công văn, quyết định, hồ sơ thủ tục vẫn nằm</text>
<text x="60" y="844" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#9AAECC" text-anchor="start">trong giấy hoặc file scan không đọc được.</text><text x="60" y="940" font-family="'Cambria','Times New Roman',serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="start">Giải pháp</text><text x="60" y="980" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#9AAECC" text-anchor="start">Lớp chuyển đổi biến hồ sơ giấy thành dữ liệu có cấu</text>
<text x="60" y="1007" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#9AAECC" text-anchor="start">trúc — không thay thế hệ thống sẵn có, bổ sung đúng</text>
<text x="60" y="1034" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#9AAECC" text-anchor="start">mắt xích còn thiếu.</text><text x="60" y="1160" font-family="'Calibri','Arial',sans-serif" font-size="15" font-weight="normal" fill="#6E93A6" text-anchor="start">Cuộc thi Tìm kiếm tài năng khởi nghiệp sáng tạo Hải Phòng 2026</text><text x="60" y="1185" font-family="'Calibri','Arial',sans-serif" font-size="14" font-weight="normal" fill="#5A7A8C" text-anchor="start">"Smart City Operations" · Lĩnh vực 3: Quản trị đô thị thông minh</text><text x="934" y="90" font-family="'Cambria','Times New Roman',serif" font-size="32" font-weight="bold" fill="#21295C" text-anchor="start">Sáu bước xử lý</text><circle cx="954" cy="153" r="15" fill="#065A82"/><text x="954" y="160" font-family="'Cambria','Times New Roman',serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="986" y="160" font-family="'Calibri','Arial',sans-serif" font-size="20" font-weight="normal" fill="#5A6B75" text-anchor="start">Tiếp nhận tài liệu scan</text><circle cx="954" cy="205" r="15" fill="#065A82"/><text x="954" y="212" font-family="'Cambria','Times New Roman',serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="986" y="212" font-family="'Calibri','Arial',sans-serif" font-size="20" font-weight="normal" fill="#5A6B75" text-anchor="start">Tối ưu dung lượng hai pha</text><circle cx="954" cy="257" r="15" fill="#065A82"/><text x="954" y="264" font-family="'Cambria','Times New Roman',serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="986" y="264" font-family="'Calibri','Arial',sans-serif" font-size="20" font-weight="normal" fill="#5A6B75" text-anchor="start">Nhận dạng ký tự, xuất PDF/A-2b</text><circle cx="954" cy="309" r="15" fill="#065A82"/><text x="954" y="316" font-family="'Cambria','Times New Roman',serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="986" y="316" font-family="'Calibri','Arial',sans-serif" font-size="20" font-weight="normal" fill="#5A6B75" text-anchor="start">AI bóc tách trường theo lược đồ</text><circle cx="954" cy="361" r="15" fill="#D98E04"/><text x="954" y="368" font-family="'Cambria','Times New Roman',serif" font-size="16" font-weight="bold" fill="#21295C" text-anchor="middle">5</text><text x="986" y="368" font-family="'Calibri','Arial',sans-serif" font-size="20" font-weight="bold" fill="#8A5D04" text-anchor="start">Cán bộ duyệt và xác nhận</text><circle cx="954" cy="413" r="15" fill="#065A82"/><text x="954" y="420" font-family="'Cambria','Times New Roman',serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="986" y="420" font-family="'Calibri','Arial',sans-serif" font-size="20" font-weight="normal" fill="#5A6B75" text-anchor="start">Đẩy vào hệ thống qua API</text><rect x="934" y="470" width="754" height="90" rx="10" fill="#FDF6E8"/><text x="958" y="508" font-family="'Cambria','Times New Roman',serif" font-size="20" font-weight="bold" fill="#8A5D04" text-anchor="start">Bước 5 là điểm thiết kế quan trọng nhất</text><text x="958" y="538" font-family="'Calibri','Arial',sans-serif" font-size="17" font-weight="normal" fill="#6B5416" text-anchor="start">Hệ thống không bao giờ ghi dữ liệu mà không có người xác nhận.</text><text x="934" y="620" font-family="'Cambria','Times New Roman',serif" font-size="26" font-weight="bold" fill="#21295C" text-anchor="start">Khác biệt so với OCR thông thường</text><rect x="934" y="655" width="754" height="85" rx="8" fill="#F0F0F0"/><text x="958" y="689" font-family="'Cambria','Times New Roman',serif" font-size="20" font-weight="bold" fill="#5A6B75" text-anchor="start">OCR thông thường</text><text x="958" y="717" font-family="'Calibri','Arial',sans-serif" font-size="16" font-weight="normal" fill="#7A8A94" text-anchor="start">Văn bản thô — vẫn phải nhập trường thủ công</text><rect x="934" y="755" width="754" height="85" rx="8" fill="#E8F1F5"/><text x="958" y="789" font-family="'Cambria','Times New Roman',serif" font-size="20" font-weight="bold" fill="#21295C" text-anchor="start">DocuFlow HP</text><text x="958" y="817" font-family="'Calibri','Arial',sans-serif" font-size="16" font-weight="normal" fill="#5A6B75" text-anchor="start">Dữ liệu có cấu trúc theo từng trường, sẵn sàng vào hệ thống</text><text x="934" y="900" font-family="'Cambria','Times New Roman',serif" font-size="26" font-weight="bold" fill="#21295C" text-anchor="start">Khách hàng mục tiêu</text><text x="934" y="940" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#5A6B75" text-anchor="start">Cơ sở giáo dục  ·  Đơn vị sự nghiệp công lập  ·  Cơ quan hành chính</text>
<text x="934" y="967" font-family="'Calibri','Arial',sans-serif" font-size="18" font-weight="normal" fill="#5A6B75" text-anchor="start">Ban quản lý khu công nghiệp  ·  Doanh nghiệp cảng và logistics</text><rect x="934" y="1010" width="120" height="120" rx="6" fill="#F0F4F6" stroke="#D8E2E8" stroke-width="2"/><text x="994" y="1065" font-family="'Calibri','Arial',sans-serif" font-size="22" font-weight="bold" fill="#B8C4CC" text-anchor="middle">QR</text><text x="994" y="1090" font-family="'Calibri','Arial',sans-serif" font-size="11" font-weight="normal" fill="#B8C4CC" text-anchor="middle">[cần điền]</text><text x="1080" y="1040" font-family="'Cambria','Times New Roman',serif" font-size="20" font-weight="bold" fill="#21295C" text-anchor="start">Liên hệ</text><text x="1080" y="1070" font-family="'Calibri','Arial',sans-serif" font-size="15" font-weight="normal" fill="#5A6B75" text-anchor="start">Trung tâm Hỗ trợ Khởi nghiệp và Đổi mới sáng tạo (SCEI)</text><text x="1080" y="1093" font-family="'Calibri','Arial',sans-serif" font-size="15" font-weight="normal" fill="#5A6B75" text-anchor="start">Trường Đại học Quản lý và Công nghệ Hải Phòng</text><text x="1080" y="1116" font-family="'Calibri','Arial',sans-serif" font-size="15" font-weight="normal" fill="#5A6B75" text-anchor="start">Số 36 đường Dân Lập, phường Dư Hàng Kênh, Hải Phòng</text><text x="1080" y="1139" font-family="'Calibri','Arial',sans-serif" font-size="15" font-weight="normal" fill="#D98E04" text-anchor="start">Điện thoại / Email: [cần điền]</text><text x="934" y="1190" font-family="'Calibri','Arial',sans-serif" font-size="13" font-weight="normal" fill="#A8B4BC" text-anchor="start" font-style="italic">Mặt trước (trái) · Mặt sau (phải) — in hai mặt, khổ A5</text></svg>